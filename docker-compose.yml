services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: platypus-game:latest
    container_name: platypus_app
    restart: unless-stopped
    init: true
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3001
      - DATABASE_PATH=/app/data/game.sqlite
      - ORGANIZER_PASSWORD=${ORGANIZER_PASSWORD}
    volumes:
      - platypus_data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  platypus_data:
